name: CI (checks only; deploys run in Cloudflare Workers Builds)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from the `packageManager` field in package.json.
      # Actions are pinned to commit SHAs on purpose; the tag is only a comment.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Cache font sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fonts-cache
          key: fonts-${{ hashFiles('scripts/fonts.mjs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Public CI has no access to the private writing repository, so it stages
      # test-only fixtures from tests/fixtures/content/. The staged tree is
      # git-ignored and never deployed; production builds read the real content
      # in Cloudflare through `pnpm build:prod`.
      - name: Stage test content fixtures
        run: pnpm content:sync:fixtures
      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Rebuilds the subsets only when new copy needs glyphs; the cache above
      # keeps that offline in most runs.
      - name: Font subsets
        run: pnpm fonts:ensure

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
